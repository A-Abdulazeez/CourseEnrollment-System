<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EnrollHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-side">
            <a href="index.html" class="back-link">← Back to Home</a>
            <div class="auth-side-content">
                <div class="large-icon">🎓</div>
                <h1>Welcome Back</h1>
                <p>Login to access your courses, manage your enrollment and continue your academic journey.</p>
            </div>
        </div>

        <div class="auth-form-container">
            <div class="auth-form">
                <h2>Login</h2>
                <p class="form-subtitle">Enter your account details to continue.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="mail@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="password" required>
                    </div>

                    <p id="message"></p>
                    <button type="submit" class="auth-button">Login</button>
                </form>

                <p class="auth-footer-text">
                    Don't have an account? <a href="register.html">Register</a>
                </p>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
